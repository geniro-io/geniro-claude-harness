name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

# One release at a time; never cancel an in-flight release. Two rapid pushes to
# main would otherwise race on the same plugin.json base version and the loser's
# `git push` would fail non-fast-forward, silently dropping a merged release.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # The pre-release test gate below runs the full suite, and the eval
          # suites read pinned judge prompts from the evals/vendor submodule.
          submodules: true

      - name: Verify jq is available
        run: jq --version

      # A push with failing tests must not cut a release. CI runs on the same
      # push, but the two workflows are independent — this is the release-side
      # gate: red tests stop the version bump and the GitHub Release.
      - name: Run shell test suites (release gate)
        run: bash tests/run-all.sh

      - name: Get current version
        id: current
        run: echo "version=$(jq -r .version .claude-plugin/plugin.json)" >> "$GITHUB_OUTPUT"

      - name: Determine version bump from commits
        id: bump
        run: |
          # Find the latest tag, or use initial commit if none exists
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LATEST_TAG" ]; then
            RANGE="HEAD"
          else
            RANGE="${LATEST_TAG}..HEAD"
          fi

          # Parse conventional commits
          COMMITS=$(git log "$RANGE" --pretty=format:"%s" 2>/dev/null || echo "")
          if [ -z "$COMMITS" ]; then
            echo "bump=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A spec-conformant `BREAKING CHANGE:` footer lives in the commit
          # BODY, which the per-subject loop below never sees — scan full
          # bodies for the footer separately.
          BODY_BREAKING=0
          if git log "$RANGE" --pretty=format:"%B" 2>/dev/null | grep -qE '^BREAKING[- ]CHANGE:'; then
            BODY_BREAKING=1
          fi

          # Default to a patch bump: a push to main with commits always cuts a
          # release, even when the messages carry no recognized semantic type
          # (chore/docs/style/ci/test, merge commits, or non-conventional text).
          # Recognized types only upgrade from there.
          BUMP="patch"
          while IFS= read -r msg; do
            # Breaking change → major; nothing outranks it, so stop scanning
            if echo "$msg" | grep -qiE '^[a-z]+(\(.+\))?!:|BREAKING CHANGE'; then
              BUMP="major"
              break
            fi
            # feat → minor (upgrade unless a breaking change already set major)
            if echo "$msg" | grep -qE '^feat(\(.+\))?:'; then
              [ "$BUMP" != "major" ] && BUMP="minor"
            fi
            # fix/perf/refactor and any unrecognized type stay at the patch default
          done <<< "$COMMITS"

          if [ "$BODY_BREAKING" -eq 1 ]; then
            BUMP="major"
          fi

          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"

      - name: Calculate new version
        id: next
        if: steps.bump.outputs.bump != 'none'
        run: |
          VERSION="${{ steps.current.outputs.version }}"
          BUMP="${{ steps.bump.outputs.bump }}"

          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          echo "version=${MAJOR}.${MINOR}.${PATCH}" >> "$GITHUB_OUTPUT"

      - name: Bump version in plugin.json
        if: steps.bump.outputs.bump != 'none'
        run: |
          NEW_VERSION="${{ steps.next.outputs.version }}"
          # Both runtime manifests carry the same version — bump them in lockstep.
          for manifest in .claude-plugin/plugin.json .cursor-plugin/plugin.json; do
            jq --arg v "$NEW_VERSION" '.version = $v' "$manifest" > tmp.json
            mv tmp.json "$manifest"
          done

      - name: Commit version bump
        id: bumpcommit
        if: steps.bump.outputs.bump != 'none'
        run: |
          NEW_VERSION="${{ steps.next.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .claude-plugin/plugin.json .cursor-plugin/plugin.json
          # [skip ci] keeps this bot commit from re-triggering the workflow.
          # Without it the patch default would treat the release commit as a
          # bump-worthy push and loop indefinitely.
          git commit -m "chore(release): v${NEW_VERSION} [skip ci]"
          git push
          # The release step tags THIS commit (not `main`, which may have moved
          # by the time the tag is created — a commit landing in between would
          # get tagged but excluded from the notes range).
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: steps.bump.outputs.bump != 'none'
        run: |
          NEW_VERSION="${{ steps.next.outputs.version }}"
          LATEST_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")

          if [ -z "$LATEST_TAG" ]; then
            NOTES=$(git log --pretty=format:"- %s" HEAD)
          else
            NOTES=$(git log --pretty=format:"- %s" "${LATEST_TAG}..HEAD~1")
          fi

          gh release create "v${NEW_VERSION}" \
            --title "v${NEW_VERSION}" \
            --notes "$NOTES" \
            --target "${{ steps.bumpcommit.outputs.sha }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
