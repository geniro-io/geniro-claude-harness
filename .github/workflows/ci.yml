name: CI

# Runs the plugin's own shell test suites + ShellCheck on every PR and on
# pushes to main. The release workflow tags its bump commit with [skip ci], so
# this never runs on the bot's version-bump push.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Shell test suites
    # Run on Linux (GNU coreutils) AND macOS (BSD coreutils) so the shell
    # portability doctrine is enforced by CI, not just asserted. fail-fast off so
    # one OS's failure still reports the other's result.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # A hung suite must not idle the runner to GitHub's 360-min default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          # evals/vendor/skills pins the judge prompts (grader.md / comparator.md). Without it the
          # run-suite comparator builds an empty prompt and every comparison degrades to a no-winner
          # TIE (primary_value 0.5). The public anthropics/skills submodule must be checked out.
          submodules: true

      - name: Verify jq is available
        run: jq --version

      # tests/run-all.sh discovers and runs every tests/**/*.sh suite, including
      # tests/authoring/lint-skills.sh (the authoring-rule lint). It exits
      # non-zero if any suite fails, so this step is the gate.
      - name: Run shell test suites + authoring lint
        run: bash tests/run-all.sh

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Ensure shellcheck is installed
        run: shellcheck --version || (sudo apt-get update && sudo apt-get install -y shellcheck)

      # Error-severity is the gate: it is clean today and only fires on genuine
      # correctness bugs (syntax errors, undefined behavior), never on stylistic
      # nits — so it ships green and stays meaningful.
      - name: ShellCheck (error severity — gating)
        run: shellcheck --severity=error $(find lib hooks tests evals -name '*.sh' -type f)

      # Warning-severity is advisory for now (the existing scripts carry a small
      # backlog of style warnings). Surfaced in the log so the backlog is
      # visible; mirrors the warn-before-block path the safety hooks use.
      - name: ShellCheck (warning severity — advisory)
        continue-on-error: true
        run: shellcheck --severity=warning $(find lib hooks tests evals -name '*.sh' -type f)
